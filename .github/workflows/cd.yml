name: Build and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-node-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/remote-ollama-herd-node
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and Push Node Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}

  publish-pypi:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Package
        working-directory: rohb
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: rohb/dist/

  build-bridge-image:
    runs-on: ubuntu-latest

    needs:
      - publish-pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta-bridge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/remote-ollama-herd-bridge
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Wait for PyPI
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          until pip index versions remote-ollama-herd-bridge | grep -q "$VERSION"
          do
            echo "Waiting for PyPI version $VERSION..."
            sleep 10
          done
      - name: Build and Push Bridge Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.router
          push: true
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}
          build-args: |
            PACKAGE_VERSION=${{ steps.version.outputs.version }}
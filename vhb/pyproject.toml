[project]
name = "vhb"
version = "0.1.0"
description = "VastAI Ollama Herd Worker Bridge"
readme = "README.md"
authors = [
    { name = "Dyllan Macias", email = "Dyllan.Macias@Cataclysma.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama-herd>=0.12.12",
    "vastai>=1.11.2",
]

[project.scripts]
vhb = "vhb.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
